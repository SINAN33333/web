<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Enrollment | Afwan International School</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="student_details.css">
     <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

<header>
    
    <h1>Afwan International School</h1>
    <p>Student Enrollment Portal</p>
</header>

<main>
    <form class="enroll-form">
        <h2>Student Enrollment Form</h2>

        <!-- Student Details -->
        <h3>Student Details</h3>

        <label>Student Full Name</label>
        <input type="text" placeholder="Enter student name" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Class Applying For</label>
        <select required>
            <option value="">Select Class</option>
            <option>KG</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
        </select>

        <label>Gender</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <!-- Parent Details -->
        <h3>Parent / Guardian Details</h3>

        <label>Parent Name</label>
        <input type="text" placeholder="Enter parent name" required>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter email address">

        <!-- Address -->
        <label>Address</label>
        <textarea placeholder="Enter full address" required></textarea>

        <button type="submit">Submit Enrollment</button>
    </form>
</main>

<footer>
    <p>© 2026 Afwan International School</p>
</footer>

</body>
</html>
